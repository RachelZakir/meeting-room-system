version: "3.9"   # Compose file format version

services:        # Define containers
  backend:       # Your Node.js app
    build: .     # Build from Dockerfile in current folder
    ports:
      - "3000:3000"   # Map container port 3000 to local port 3000
    depends_on:
      - db            # Wait until db service is up
    environment:
      DATABASE_URL: "postgresql://admin:secret@db:5432/meeting_room"

  db:            # PostgreSQL database
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: meeting_room
    ports:
      - "5432:5432"   # Map container port 5432 to local port 5432
